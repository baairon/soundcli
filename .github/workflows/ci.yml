name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should never hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The suite never spawns mpv, yt-dlp or ffmpeg and never leaves
      # os.tmpdir(), so a bare runner is all it needs. The platform-gated
      # cases in display-path, move-library and recover-path are the whole
      # reason the matrix spans three operating systems.
      - run: npm test

      # Builds what `npm publish` would build, so a broken publish path is
      # caught here rather than at release time.
      - run: npm run build

      # The other half of prepublishOnly: dist must import only declared
      # dependencies, @inkjs/ui must stay bundled, and no production package
      # may carry an install script.
      - run: npx tsx scripts/check-dist-imports.ts
