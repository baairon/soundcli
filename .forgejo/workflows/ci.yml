name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release tip be checked by hand before an npm publish.
  workflow_dispatch:

# On a pull request a new push supersedes the run in flight: only the branch's
# latest commit needs a verdict. A push to main is never cancelled and never
# waits behind another one: each is a group of its own, so commits pushed one
# after another all keep a result of their own.
concurrency:
  group: ci-${{ forgejo.event_name == 'pull_request' && forgejo.ref || forgejo.sha }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} on Linux
    runs-on: docker
    container:
      image: "docker.io/library/node:${{ matrix.node }}-bookworm"
    strategy:
      # One Node version failing should never hide the result on the other.
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      - run: npm ci

      - run: npm run typecheck

      # The suite never spawns mpv, yt-dlp or ffmpeg and never leaves
      # os.tmpdir(), so the stock Node image is all it needs. The Windows and
      # macOS cases in display-path, move-library and recover-path skip on
      # this Linux runner; run npm test on those platforms to cover them.
      - run: npm test

      # Builds what `npm publish` would build, so a broken publish path is
      # caught here rather than at release time.
      - run: npm run build

      # The other half of prepublishOnly: dist must import only declared
      # dependencies, @inkjs/ui must stay bundled, and no production package
      # may carry an install script.
      - run: npx tsx scripts/check-dist-imports.ts
